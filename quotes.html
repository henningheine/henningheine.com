        <section aria-labelledby="perspective">
          <h2 id="perspective">Perspective</h2>
          <div class="quote-list">
            <figure class="quote">
              <blockquote><p>Have clarity of vision, but a flexibility of process.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>What the wise man believes in the beginning, the fool believes in the end.</p></blockquote>
            </figure>
            <figure class="quote quote-long">
              <blockquote><p>It would be to think of one’s career (~40 yrs) as a portfolio of ~10 bets. Add things upfront that are low risk / high status as a safety net if needed. But move to optimize around high risk and high reward. Each bet might only have a 10% shot of success (seems low), but the odds of at least one home run is 1 − (1 − 10%)<sup>10</sup> = 66% (pretty high).</p></blockquote>
              <figcaption>Sundeep Peechu, Felicis</figcaption>
            </figure>
            <figure class="quote">
              <blockquote>
                <p lang="zh">失了面子，得了里子。</p>
                <p class="translation">Lose face; gain substance.</p>
              </blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>There is a tide in the affairs of men which, taken at the flood, leads on to fortune. Omitted, all the voyage of their life is bound in shallows and in miseries. On such a full sea are we now afloat.</p></blockquote>
              <figcaption>William Shakespeare</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>When going up the ladder, don’t forget the stairs you stepped on. You may need them while going down.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Don’t let someone else’s opinion of you become your reality.</p></blockquote>
              <figcaption>Les Brown</figcaption>
            </figure>
            <figure class="quote quote-dialogue">
              <blockquote>
                <p>“How far can you see?”</p>
                <p>“To the end of the street.”</p>
                <p>“How far could you see if you were up there?” he asks, pointing to the tallest building.</p>
                <p>“I can’t imagine without standing up there.”</p>
                <p>“Exactly. That’s the difference between you and God. You just don’t know.”</p>
              </blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Wisdom consists of many rich experiences that have been reflected upon until they can be empathically communicated to others.</p></blockquote>
              <figcaption>Marian Wrobel</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>What the wise have in common is the capacity and willingness to step back from the immediacy of the moment—whether it is an affect, a judgment, or a conflict—in order to attain perspective.</p></blockquote>
              <figcaption>Michael Buehler</figcaption>
            </figure>
            <figure class="quote">
              <blockquote>
                <p class="translation" lang="de">Wenn wir die Menschen nur nehmen, wie sie sind, so machen wir sie schlechter; wenn wir sie behandeln, als wären sie, was sie sein sollten, so bringen wir sie dahin, wohin sie zu bringen sind.</p>
                <p>When we take people merely as they are, we make them worse; when we treat them as if they were what they should be, we improve them as far as they can be improved.</p>
              </blockquote>
              <figcaption>Johann Wolfgang von Goethe</figcaption>
            </figure>

        <section aria-labelledby="adversity">
          <h2 id="adversity">Adversity</h2>
          <div class="quote-list">
            <figure class="quote">
              <blockquote><p>Failures are just detours.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Life is a storm, my young friend. You will bask in the sunlight one moment and be shattered on the rocks the next. What makes you a man is what you do when that storm comes.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote>
                <p lang="zh">生於憂患，死於安樂。</p>
                <p class="translation">Thrive in adversity; perish in comfort.</p>
              </blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Life doesn’t happen to you; it happens for you.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Your hardest times often lead to the greatest moments of your life.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Gold is tested in the fiery furnace, but acceptable human beings are tested in the furnace of adversity.</p></blockquote>
              <figcaption>Sirach 2:5</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>He that wrestles with us strengthens our nerves and sharpens our skill. Our antagonist is our helper.</p></blockquote>
              <figcaption>Edmund Burke</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>Pressure is a privilege.</p></blockquote>
              <figcaption>Billie Jean King</figcaption>
            </figure>
          </div>
        </section>

        <section aria-labelledby="life-and-meaning">
          <h2 id="life-and-meaning">Life and meaning</h2>
          <div class="quote-list">
            <figure class="quote">
              <blockquote><p>To whom much is given, much will be required.</p></blockquote>
              <figcaption>Luke 12:48</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>We are the custodians of our own life’s meaning.</p></blockquote>
              <figcaption>Carl Sagan</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>Success has many fathers. Failure is an orphan.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>Don’t aim at success. The more you aim at it and make it a target, the more you are going to miss it. For success, like happiness, cannot be pursued; it must ensue.</p></blockquote>
              <figcaption>Viktor E. Frankl</figcaption>
            </figure>
            <figure class="quote">
              <blockquote><p>We cannot tell the precise moment when friendship is formed. As in filling a vessel drop by drop, there is at last a drop which makes it run over; so in a series of kindnesses there is at last one which makes the heart run over.</p></blockquote>
              <figcaption>James Boswell</figcaption>
            </figure>
            <figure class="quote quote-verse">
              <blockquote>
                <p>I wish I could show you,<br />when you are lonely or in darkness,<br />the astonishing light<br />of your own being.</p>
              </blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>We have two lives, and the second begins when we realize we only have one.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>One never really knows how much one has been touched by a place until one has left it.</p></blockquote>
            </figure>
            <figure class="quote">
              <blockquote><p>To fail to confront the past is to live and work in a world of dishonesty and historical illusion, and we have too much of that today.</p></blockquote>
            </figure>
            <figure class="quote quote-long">
              <blockquote>
                <p>I’m not about to lose my life. Life is what happens before we die; my life cannot be lost or taken from me. Nothing can alter or negate the pathway of my life that brought me to this place.</p>
                <p>My life is all the joys, the sorrows, the fulfillments, the disappointments, the adventures and misadventures I have lived. It is all those I have loved and embraced and those I have scorned; those who have loved and embraced me and those who have scorned me.</p>
                <p>All of it will forever remain my life, the life that I alone have lived. So, if you are inclined to mourn for me, don’t. Celebrate for me; celebrate my life, and be glad for all the wondrous gifts it bestowed on me.</p>
              </blockquote>
              <figcaption>Jerry Allen King</figcaption>
            </figure>
          </div>
        </section>

    <script>
      const themeToggle = document.querySelector('.theme-toggle');
      const updateThemeToggle = () => {
        const isDark = document.documentElement.dataset.theme === 'dark';
        themeToggle.textContent = isDark ? 'day' : 'night';
      };
      themeToggle.addEventListener('click', (event) => {
        event.preventDefault();
        const isDark = document.documentElement.dataset.theme === 'dark';
        const nextTheme = isDark ? 'light' : 'dark';
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem('theme', nextTheme);
        updateThemeToggle();
      });
      updateThemeToggle();

      const themeToc = document.querySelector('.theme-toc');
      const themeSections = [...document.querySelectorAll('#quotes > section')];
      const themeTocList = document.createElement('div');
      themeTocList.className = 'theme-toc-list';
      themeToc.append(themeTocList);
      const themeLinks = themeSections.map((section) => {
        const heading = section.querySelector('h2');
        const link = document.createElement('a');
        link.href = '#' + heading.id;
        link.textContent = heading.textContent;
        themeTocList.append(link);
        return link;
      });

      let themeTocFrame = 0;
      const updateActiveTheme = () => {
        themeTocFrame = 0;
        const marker = window.innerHeight * 0.32;
        let activeSection = themeSections[0];

        themeSections.forEach((section) => {
          if (section.getBoundingClientRect().top <= marker) activeSection = section;
        });

        const isAtPageBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 4;
        if (isAtPageBottom) activeSection = themeSections[themeSections.length - 1];

        const activeIndex = themeSections.indexOf(activeSection);
        themeTocList.style.transform = 'translateY(' + ((3 - activeIndex) * 19) + 'px)';

        themeLinks.forEach((link, index) => {
          const distance = Math.abs(index - activeIndex);
          const isVisible = distance <= 3;
          const isActive = index === activeIndex;
          const opacity = [1, 0.78, 0.52, 0.28][distance] || 0;

          link.classList.toggle('is-visible', isVisible);
          link.classList.toggle('is-active', isActive);
          link.style.setProperty('--toc-opacity', opacity);
          link.tabIndex = isVisible ? 0 : -1;
          if (isActive) link.setAttribute('aria-current', 'true');
          else link.removeAttribute('aria-current');
        });
      };

      const queueThemeTocUpdate = () => {
        if (!themeTocFrame) themeTocFrame = window.requestAnimationFrame(updateActiveTheme);
      };

      const quotes = [...document.querySelectorAll('.quote')];
      let quoteFocusFrame = 0;
      const updateFocusedQuote = () => {
        quoteFocusFrame = 0;
        const viewportCenter = window.innerHeight / 2;
        const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
        const scrollProgress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
        const firstBounds = quotes[0].getBoundingClientRect();
        const lastBounds = quotes[quotes.length - 1].getBoundingClientRect();
        const firstDocumentCenter = firstBounds.top + window.scrollY + firstBounds.height / 2;
        const lastDocumentCenter = lastBounds.top + window.scrollY + lastBounds.height / 2;
        const topReadingLine = Math.min(viewportCenter, firstDocumentCenter);
        const bottomReadingLine = Math.max(viewportCenter, lastDocumentCenter - maxScroll);
        const readingLine = topReadingLine + (bottomReadingLine - topReadingLine) * scrollProgress;
        let focusedQuote = quotes[0];
        let closestDistance = Infinity;

        quotes.forEach((quote) => {
          const bounds = quote.getBoundingClientRect();
          const quoteCenter = bounds.top + bounds.height / 2;
          const distance = Math.abs(quoteCenter - readingLine);
          if (distance < closestDistance) {
            closestDistance = distance;
            focusedQuote = quote;
          }
        });

        quotes.forEach((quote) => quote.classList.toggle('is-focused', quote === focusedQuote));
        document.documentElement.classList.add('quote-focus-ready');
      };

      const queueQuoteFocusUpdate = () => {
        if (!quoteFocusFrame) quoteFocusFrame = window.requestAnimationFrame(updateFocusedQuote);
      };

      window.addEventListener('scroll', queueThemeTocUpdate, { passive: true });
      window.addEventListener('resize', queueThemeTocUpdate);
      window.addEventListener('scroll', queueQuoteFocusUpdate, { passive: true });
      window.addEventListener('resize', queueQuoteFocusUpdate);
      themeLinks.forEach((link) => link.addEventListener('click', queueThemeTocUpdate));
      updateActiveTheme();
      updateFocusedQuote();
    </script>
